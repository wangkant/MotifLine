kant: /path/to/kant
envs:
  compute: /path/to/kant/envs/chrombpnet_local   # torch, chrombpnet, tangermeme, modisco-lite, finemo 0.30
  star: /path/to/kant/envs/gpn_star              # GPN-Star only: torch 2.6.0+cu124 + gpn 0.9.0 (attr_star.py)
chrombpnet_src: /path/to/kant/models/chrombpnet-pytorch
ag_src: /path/to/kant/models/alphagenome-pytorch-deeplift/src
genome:
  fasta: /path/to/kant/data/genome/hg38.fa
  chrom_sizes: /path/to/kant/data/genome/hg38.chrom.sizes

# Attribution references (cbp / ag). tangermeme seeds each reference by random_state +
# shuffle index (deep_lift_shap.py:428-433), deliberately so batching cannot change the
# output; what CAN change it is the reference COUNT and the seed. Both are stated here
# rather than inherited from chrombpnet's/tangermeme's signature, which a version bump
# could move under us. A run may override either.
attribution:
  n_shuffles: 20         # == the tools' current default; verified, not assumed
  random_state: 42

# Attribution windows are NOT configured here any more (geometry.py removed 2026-09-07):
# a run that declares in_window/crop passes them to its step, an unspecified run gets
# the step's own default (cbp 2114; ag 2048 in / 2048 stored; star 1536), and every
# downstream stage reads the width off attr.npy itself.

# GPN-Star (steps/attr_star.py): model from HF, alignment from the zarr stores that
# new_experiment/star/scripts/02_download_msa.sh downloaded. A run may override either.
star:
  msa_path: /path/to/kant/data/gpn_star_msa/multiz100way
  repo: songlab/gpn-star-hg38-v100-200m
  chunk: 100

runs:
  # ---- adopted runs: archived attributions linked in, downstream recomputed ----
  # FROZEN 2026-09-07. The arrays these three adopted were deleted when the region_v3
  # (k562, gm12878) and region_v4/02_motif_grammar results were cleared; their attr/ohe
  # symlinks dangle, while modisco.h5 / regions.npz / hits.tsv / naming stay under
  # results/<run>/ as finished artifacts. `cancelled: true` keeps a bare `snakemake` from trying to
  # re-import a directory that no longer exists; the entries stay so the artifacts keep
  # a run definition to be read against.
  k562_cbp_adopted:
    cancelled: true
    cancelled_note: results/k562_cbp_adopted/CANCELLED.md
    model: cbp
    adopt_from: /path/to/kant/new_experiment/region_v3/k562/interpret_cbp_par_hyp
    adopt_peaks: peaks.bed          # already the 11-col load_region_df form
    rows: 33917
    in_window: 2114
  # AG at its NATIVE 2048bp window (16 x 128bp trunk bins). Same 33,917 regions, same
  # peaks.bed rows as the CBP side, so the two runs pair row-for-row.
  k562_ag2048_adopted:
    cancelled: true
    cancelled_note: results/k562_ag2048_adopted/CANCELLED.md
    model: ag
    adopt_from: /path/to/kant/new_experiment/region_v4/02_motif_grammar/interpret_ag2048_par_hyp/k562
    adopt_peaks: peaks.bed          # 4-col chr/start/end/summit -> expanded to narrowPeak form
    rows: 33917
    in_window: 2048
    crop: 2048
  gm12878_cbp_adopted:
    cancelled: true
    cancelled_note: results/gm12878_cbp_adopted/CANCELLED.md
    model: cbp
    adopt_from: /path/to/kant/new_experiment/region_v3/gm12878/interpret_cbp_par_hyp
    adopt_peaks: peaks.bed
    rows: 21084
    in_window: 2114
  # ---- GPN-Star (2026-09-07): the third model, computed by this pipeline ----
  # Regions: the same 33,917 K562 peaks the CBP/AG runs were discovered on, in the
  # 11-column form k562_cbp_adopted wrote (config/peaks/, the archive's own peaks.bed is
  # gone). `head: 2000` is the pilot; drop it (and add n_shards) for the full set.
  # `stride` and `source` are the run's two declared choices -- see attr_star.py.
  k562_star_pilot:
    model: star
    peaks: config/peaks/k562_allpeaks_33917.bed
    stride: 8            # positions p % 8 == r masked together; 8 passes per strand
    source: none         # none = with the alignment; mask = human sequence only
    head: 2000
    in_window: 1536
    chunk: 100

# Canonical parameters. Every value here is the tool's own official default
# (`--help` in envs/chrombpnet_local) unless the note says why it cannot be.
modisco:
  max_seqlets: 1000000   # -n is REQUIRED by the CLI: no official default exists to adopt
  window: 400            # official default (was 500 in region_v3 / the vertical slice)
  # -l 2, -z 20, -t 30, -f 5, -g 10, -j 0 left unset = official defaults
finemo:
  mode: pp               # official default
  threshold: 0.3         # -t, official default
  alpha: 0.7             # -l/--global-lambda, official default
  batch: 2000            # -b, official default (vertical slice ran 1000)
  # -s 3.0, -i 0.08, -j 0.7, -c 5e-4, -S 10000 left unset = official defaults

# Reference lexicon: where pattern NAMES come from (2026-08-25). Rationale:
# src/motifline/naming.py. The chain is sources -> union -> RSAT clustering -> medoid
# library + cluster-tagged union -> TomTom -> gate. Every rule reproduces an artifact
# that was built once by hand for the manuscript; the pipeline versions were checked
# against those and are byte-identical (union, medoid MEME, cluster-tagged union) or
# equal within 1.1e-15 (the Ncor matrix).
reference_lexicon:
  # Concatenated in this order. Both are the publishers' own non-redundant releases;
  # neither has been de-duplicated further, on purpose -- see naming.py on why the
  # match target must be the full set.
  sources:
    H14: /path/to/hocomoco14_core.meme
    JAS: /path/to/jaspar2026_core_vert_nr.meme
  rsat:
    bin: /path/to/kant/envs/rsat/bin/rsat      # rsat-core 2025.04.04
    hclust_method: average
    metric: Ncor
    # RSAT standalone defaults these to EMPTY; the values below are the web server's
    # documented defaults and have to be passed explicitly or the clustering differs.
    # ONLY these two: under `-quick` RSAT rewrites %lth to {Ncor, cor} and discards
    # every other arm (matrix-clustering:2249-2257). Verified live -- a run given
    # `-lth w 5` alongside them reaches the R script as `lthsp = 'Ncor_0.55_cor_0.75_'`.
    # Declaring `w` here is refused rather than silently dropped. The Ncor comparability
    # floor used elsewhere in the naming chain is a different number (w_th below).
    lth:
      cor: 0.75
      Ncor: 0.55
    quick: true
  # Minimum comparable overlap (columns) for the Ncor arm: the all-pairs Ncor that
  # picks each cluster's medoid, and the IC-core floor below which a pattern has no
  # comparable Ncor and so fails the gate by construction. NOT rsat.lth.w (RSAT
  # discards that under -quick) and NOT TomTom's -min-overlap (pinned to modiscolite's
  # parameter set). Three numbers that happen to be 5; this key owns two of them.
  w_th: 5
  tomtom: /path/to/kant/envs/meme/bin/tomtom
  # Both arms required. qval is the conventional 0.05; ncor is set to rsat.lth.Ncor on
  # purpose -- "annotated" then means the clustering itself would have merged the
  # pattern with its match, which is what rules out significant-but-wrong labels
  # (a repeat element carrying a TF half-site is the standard case).
  gate:
    qval: 0.05
    ncor: 0.55
