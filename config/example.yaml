envs:
  compute: /path/to/envs/compute
chrombpnet_src: /path/to/chrombpnet-pytorch
genome:
  fasta: /path/to/hg38.fa
  chrom_sizes: /path/to/hg38.chrom.sizes

# A run may override either value.
attribution:
  n_shuffles: 20
  random_state: 42

runs:
  # ChromBPNet, split into 4 GPU shards and merged.
  k562_cbp:
    model: cbp
    wo_bias: /path/to/k562_chrombpnet_wo_bias.pt
    peaks: config/peaks/k562_allpeaks_33917.bed
    n_shards: 4

  # AlphaGenome. `track` indexes the ATAC head; `biosample` must match that track's
  # biosample_name in AlphaGenome's metadata or the step refuses to run.
  k562_ag:
    model: ag
    ag_src: /path/to/alphagenome-pytorch/src
    weights: /path/to/alphagenome_weights.safetensors
    peaks: config/peaks/k562_allpeaks_33917.bed
    track: 60
    biosample: K562
    chunk: 100
    in_window: 2048
    crop: 2048

  # Attributions computed elsewhere: attr.npy, ohe.npy and a peaks bed in one directory.
  # `rows` is the row count the arrays must have. `cancelled: true` keeps a run out of
  # the default targets.
  k562_cbp_archived:
    model: cbp
    adopt_from: /path/to/archived_attributions
    rows: 10000
    in_window: 2114
    cancelled: true

# Tool defaults except max_seqlets (no default) and n_leiden.
modisco:
  max_seqlets: 1000000
  window: 400
  # -l: the CLI default is 2; TFMoDISco() and the original TF-MoDISco use 50
  n_leiden: 50
finemo:
  mode: pp
  threshold: 0.3      # --cwm-trim-threshold, not a hit-score threshold
  alpha: 0.7          # --global-lambda
  batch: 2000

reference_lexicon:
  sources:
    H14: /path/to/hocomoco14_core.meme
    JAS: /path/to/jaspar2026_core_vert_nr.meme
  h14_annotation: /path/to/H14CORE_annotation.jsonl
  tomtom: /path/to/envs/meme/bin/tomtom
  # flags matches with q <= this as confident; nothing is dropped
  qval_threshold: 0.05
