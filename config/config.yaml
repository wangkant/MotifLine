envs:
  compute: /path/to/envs/compute
genome:
  fasta: /path/to/hg38.fa
  chrom_sizes: /path/to/hg38.chrom.sizes
# shard i runs on gpus[i % len(gpus)]; FiNeMo on gpus[0]
gpus: [0, 1, 2, 3]

attribution:
  n_shuffles: 20
  random_state: 42

runs:
  k562_cbp:
    model: cbp
    wo_bias: /path/to/k562_chrombpnet_nobias.h5
    peaks: config/peaks/k562_allpeaks_33917.bed
    n_shards: 4
  k562_ag:
    model: ag
    ag_src: /path/to/alphagenome-pytorch/src
    weights: /path/to/alphagenome_weights.safetensors
    peaks: config/peaks/k562_allpeaks_33917.bed
    track: 60           # K562 ATAC
    n_shards: 4

modisco:
  max_seqlets: 1000000
  window: 400
  n_leiden: 50        # -l
finemo:
  mode: pp
  threshold: 0.3      # --cwm-trim-threshold
  alpha: 0.7          # --global-lambda
  batch: 2000

reference_lexicon:
  sources:
    - /path/to/hocomoco14_core.meme
    - /path/to/jaspar2026_core_vert_nr.meme
  h14_annotation: /path/to/H14CORE_annotation.jsonl
  tomtom: /path/to/envs/meme/bin/tomtom
  qval_threshold: 0.05
