envs:
  compute: .envs/compute
genome:
  fasta: data/hg38.fa
  chrom_sizes: data/hg38.chrom.sizes
# shard i runs on gpus[i % len(gpus)]; FiNeMo on gpus[0]
gpus: [0, 1, 2, 3]

attribution:
  n_shuffles: 20
  random_state: 42

runs:
  k562_cbp:
    model: cbp
    wo_bias: weights/k562_chrombpnet_nobias.h5
    peaks: config/peaks/k562_allpeaks_33917.bed
    n_shards: 4
  k562_ag:
    model: ag
    weights: data/alphagenome_model_fold_0.safetensors
    peaks: config/peaks/k562_allpeaks_33917.bed
    track: 60           # K562 ATAC
    in_window: 2048     # model input in bp, a multiple of 2048
    n_shards: 4

modisco:
  max_seqlets: 1000000
  window: 400
  n_leiden: 50        # -l
finemo:
  mode: pp
  threshold: 0.3      # --cwm-trim-threshold
  alpha: 0.7          # --global-lambda
  batch: 2000

reference_lexicon:
  sources:
    - data/H14CORE_meme_format.meme
    - data/JASPAR2026_CORE_vertebrates_non-redundant_pfms_meme.txt
  h14_annotation: data/H14CORE_annotation.jsonl
  tomtom: .envs/meme/bin/tomtom
  qval_threshold: 0.05

# drawn last: each run's contributions over the region, its FiNeMo hits shaded and named
plots:
  example:
    region: chr15:77228858-77229158
    runs: [k562_cbp, k562_ag]
