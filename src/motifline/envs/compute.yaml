# AlphaGenome attribution, MoDISco and FiNeMo. Model code is not installed here; the AG
# step puts the ag_src checkout on sys.path. Exact versions: envs/locks/compute.*
#
# DeepLIFT/SHAP references are seeded, but a different torch or CUDA build can still
# change the last digits of an attribution.
name: motifline-compute
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1+cu121
      - numpy==2.0.1
      - pandas==2.3.3
      - scipy==1.15.3
      - h5py==3.16.0
      - pyfaidx==0.9.0.4
      - tangermeme==1.0.4
      - modisco-lite==2.4.0
      # FiNeMo 0.30 has no PyPI release
      - finemo @ git+https://github.com/austintwang/finemo_gpu.git@5c6f521c773f61f50307ff7cc59682073a56a65a
      # lightning and pooch were for the removed ChromBPNet PyTorch port; pyBigWig, tqdm and
      # safetensors are imported by alphagenome-pytorch
      - lightning==2.6.1
      - pooch==1.9.0
      - pyBigWig==0.3.25
      - tqdm==4.67.3
      - safetensors==0.7.0
      # reads AlphaGenome's track metadata
      - pyarrow==17.0.0
      # reads official ChromBPNet contribution h5 (blosc)
      - tables==3.10.1
