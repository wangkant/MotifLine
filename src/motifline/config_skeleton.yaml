# motifline config, written by `motifline init`. Check it with `motifline check`.
# Paths are absolute or relative to the motifline checkout.

envs:
  compute: /path/to/envs/compute      # built from envs/compute.yaml

chrombpnet_src: /path/to/chrombpnet-pytorch

genome:
  fasta: /path/to/hg38.fa
  chrom_sizes: /path/to/hg38.chrom.sizes

# DeepLIFT/SHAP references: dinucleotide shuffles, seeded by random_state + shuffle index
attribution:
  n_shuffles: 20
  random_state: 42

# modisco motifs: -n has no default and must be set; -w 400 is the default
modisco:
  max_seqlets: 1000000
  window: 400

# finemo call-hits defaults (0.30)
finemo:
  mode: pp
  threshold: 0.3
  alpha: 0.7
  batch: 2000

reference_lexicon:
  sources:
    H14: /path/to/hocomoco14_core.meme
    JAS: /path/to/jaspar2026_core_vert_nr.meme
  h14_annotation: /path/to/H14CORE_annotation.jsonl
  tomtom: /path/to/envs/meme/bin/tomtom

# One entry per run; see config/example.yaml.
runs: {}
