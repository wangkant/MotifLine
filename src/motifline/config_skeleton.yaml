# motifline config, written by `motifline init`. Check it with `motifline check`.
# Paths are absolute or relative to the project directory (where motifline runs).

envs:
  compute: /path/to/envs/compute        # built from envs/compute.yaml
  chrombpnet: /path/to/envs/chrombpnet  # built from envs/chrombpnet.yaml; official ChromBPNet

# Only for ChromBPNet runs with backend: pytorch, the fallback to the official code
# chrombpnet_src: /path/to/chrombpnet-pytorch

genome:
  fasta: /path/to/hg38.fa
  chrom_sizes: /path/to/hg38.chrom.sizes

# DeepLIFT/SHAP references: dinucleotide shuffles, seeded by random_state + shuffle index
attribution:
  n_shuffles: 20
  random_state: 42

# modisco motifs: -n has no default and must be set; -w 400 is the default
modisco:
  max_seqlets: 1000000
  window: 400
  # -l: the CLI default is 2; TFMoDISco() and the original TF-MoDISco use 50
  n_leiden: 50

# finemo call-hits defaults (0.30)
finemo:
  mode: pp
  threshold: 0.3
  alpha: 0.7
  batch: 2000

reference_lexicon:
  sources:
    H14: /path/to/hocomoco14_core.meme
    JAS: /path/to/jaspar2026_core_vert_nr.meme
  h14_annotation: /path/to/H14CORE_annotation.jsonl
  tomtom: /path/to/envs/meme/bin/tomtom
  # flags matches with q <= this as confident; nothing is dropped
  qval_threshold: 0.05

# One entry per run; see config/example.yaml in the motifline repository.
runs: {}
