# RSAT matrix-clustering only, for `rule lexicon_rsat` -- the one expensive step in
# the naming chain (1h46m over 2,614 matrices). Point reference_lexicon.rsat.bin at
# <prefix>/bin/rsat, the launcher, not at matrix-clustering itself.
#
#   conda env create -p <kant>/envs/rsat -f envs/rsat.yaml
#
# The launcher exits 0 whatever happens, so rule lexicon_rsat checks that the
# partition covers the union it was given rather than trusting the exit code.
name: motifline-rsat
channels: [bioconda, conda-forge]
dependencies:
  - rsat-core=2025.04.04
