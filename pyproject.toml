[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motifline"
version = "0.1.0.dev0"
description = "Snakemake attribution->MoDISco->FiNeMo pipeline"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "snakemake>=8"]

[project.optional-dependencies]
# h5py and pyyaml are test-time imports: tests/test_naming.py loads the step scripts
# (name_patterns imports h5py) and test_lexicon_context_is_subset imports yaml. A
# collection error aborts the whole session, so leaving them out cost all 73 tests,
# not one file.
dev = ["pytest", "h5py", "pyyaml", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
