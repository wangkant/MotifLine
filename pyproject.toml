[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motifline"
version = "0.1.0.dev0"
description = "Snakemake attribution->MoDISco->FiNeMo pipeline"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "snakemake>=8"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
